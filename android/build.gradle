
buildscript {
    repositories {
        mavenLocal()
        google()
        jcenter()
        maven {
            allowInsecureProtocol = true
            url "http://mvnrepo.alibaba-inc.com/mvn/repository"
        }
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 31

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError false
    }
    repositories {
        mavenLocal()
        google()
        jcenter()
        maven {
            allowInsecureProtocol = true
            url "http://mvnrepo.alibaba-inc.com/mvn/repository"
        }
        flatDir {
            dirs 'libs'
        }
    }
    sourceSets.main.jniLibs.srcDirs=['libs']

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }
}

repositories {
    mavenCentral()
    maven(){ url 'https://maven.aliyun.com/repository/releases' }
    maven{ url "https://maven.aliyun.com/nexus/content/repositories/releases" }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.facebook.react:react-native:+'
    implementation(name:'auth_number_product-2.14.23-log-online-standard-cuum-release', ext:'aar')
    implementation(name:'main-2.2.3-release', ext:'aar')
    implementation(name:'logger-2.2.2-release', ext:'aar')
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.alibaba:fastjson:1.2.75' // 配置对gson的依赖
}
